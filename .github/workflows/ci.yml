name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    # windows-2022 (Visual Studio 2022): opencascade-sys 0.3's C++ glue does not
    # compile with Visual Studio 2026 / MSVC 14.51 (C2440 on OCCT handle types).
    runs-on: ${{ matrix.os }}
    # The first run compiles OpenCASCADE from source; later runs hit the cache.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake
      - uses: Swatinem/rust-cache@v2
        with:
          # occt-sys installs OCCT here; it must be cached together with the
          # build-script outputs that point at it.
          cache-directories: target/OCCT
          key: occt-7.8.1
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Test
        run: cargo test --release --workspace --locked
      - name: MCP smoke test
        run: python3 scripts/mcp_smoke.py target/release/rustworks-mcp
        shell: bash

  truck-fallback:
    name: Pure-Rust kernel (truck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p rw-sketch
      - run: cargo test --locked -p rw-kernel --no-default-features --features truck
